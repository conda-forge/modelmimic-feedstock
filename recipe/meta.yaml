{% set python_min = "3.10" %}
{% set name = "modelmimic" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/modelmimic-{{ version }}.tar.gz
  sha256: ae2f10bb34b94a3431b211318f553be8a36f3d413b77a3103bb3d624f9237b11

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - xarray
    - netcdf4
    - pandas
    - toml

test:
  imports:
    - modelmimic
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/LIVVkit/modelmimic
  summary: Generate model-like data, _mimic_ the output of various CIME tests.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mkstratos
